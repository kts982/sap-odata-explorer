[workspace]
members = ["crates/core", "crates/cli", "tauri-app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
# Core + CLI floor: let-chains (stable in 1.88) and locked dependencies
# (cookie_store, time). CI's `msrv` job builds both on exactly this
# version. The desktop crate declares its own, higher floor.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/kts982/sap-odata-explorer"

[workspace.dependencies]
# `version` alongside `path`: local builds resolve via path, `cargo publish`
# rewrites the dependency to the crates.io version.
sap-odata-core = { path = "crates/core", version = "0.2.0" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# TLS stays on native-tls (SChannel on Windows: Windows certificate store,
# so corporate CAs keep working) without ALPN, i.e. HTTP/1.1 over TLS, the
# same as reqwest 0.12's default. reqwest 0.13 defaults to rustls and
# would negotiate HTTP/2, which Negotiate (Windows SSO) does not survive.
reqwest = { version = "0.13", default-features = false, features = [
  "native-tls-no-alpn",
  "charset",
  "http2",
  "system-proxy",
  "cookies",
  "json",
] }
roxmltree = "0.21"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
percent-encoding = "2"
toml = "1.1"
keyring = { version = "3", features = ["windows-native"] }
directories = "6"
base64 = "0.23"
flate2 = "1"
dialoguer = "0.12"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "macros"] }

[workspace.dependencies.windows]
version = "0.62"
features = [
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Credentials",
]
