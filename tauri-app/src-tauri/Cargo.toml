[package]
name = "sap-odata-explorer-app"
version = "0.2.0"
edition = "2024"
# Tauri 2.12 requires 1.90.
rust-version = "1.90"
# Desktop app ships as GitHub Release binaries, never to crates.io.
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sap-odata-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# User-initiated update check against the GitHub releases API.
reqwest.workspace = true
tokio = { version = "1", features = ["full"] }
anyhow = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
