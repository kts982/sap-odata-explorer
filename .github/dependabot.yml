# Complements the weekly cargo-audit CI cron (RustSec, fails CI, catches
# transitives — remains the authoritative CVE gate). Dependabot covers what
# that cron can't see: GitHub Actions versions, npm devDeps, and routine
# freshness PRs. Monthly + grouped to cap PR noise on a solo project;
# majors arrive as individual PRs so they can be vetted one at a time.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/tauri-app"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-dev-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
